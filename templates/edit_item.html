<!DOCTYPE html>
<html>

<head>
  <title>Ilmoituksen muokkaus</title>
</head>

<body>
  <h1>Ilmoituksen muokkaus</h1>
  <form action="/update_item" method="post">
    <p>
      Elokuvan nimi: <br />
      <input type="text" name="title" value="{{item.title}}"/>
    </p>
    <p>
      Ohjaaja, julkaisuvuosi ja genre: <br />
      <textarea name="info" rows="2" cols="30">{{item.info}}</textarea>
    </p>
    <p>
      Arvio: <br />
      <textarea name="review" rows="8" cols="60">{{item.review}}</textarea>
    </p>
    <input type="hidden" name="item_id" value="{{item.id}}"/>
    <input type="submit" value="Päivitä ilmoitusta" />
  </form>
</body>

</html>
