{%extends "layout.html"%}

{%block title%}Arvostelun muokkaus{%endblock%}

{%block content%}

<h2>{{review.title}}</h2>
<h3>Arvostelun muokkaus</h3>

<form action="/update_review" method="post">
  <p>
    <label for="title">Elokuvan nimi:</label> <br />
    <input type="text" name="title" id="title" value="{{review.title}}" maxlength="50" required/>
  </p>
  <p>
    <label for="director">Ohjaaja:</label> <br />
    <input type="text" name="director" id="director" value="{{review.director}}" maxlength="50" required/>
  </p>

  <p>
    <label for="release_year">Julkaisuvuosi:</label> <br />
    <input type="number" name="release_year" id="release_year" value="{{review.release_year}}" required/>
  </p>

  <p>
    <label for="genre">Genre:</label> <br />
    <input type="text" name="genre" id="genre" value="{{review.genre}}" maxlength="50" required/>
  </p>

  <p>
    <label for="content">Arvio:</label> <br />
    <textarea name="content" id="content" rows="8" cols="60" maxlength="1000" required>{{review.content}}</textarea>
  </p>

  <input type="hidden" name="review_id" value="{{review.id}}"/>

  <p>
    <label for="theme">Teema:</label> <br />
    <select name="theme" id="theme">
      <option value="">(valitse)</option>
      {%for theme in themes%}
        {%if theme.value==classes.theme%}
          <option value="{{theme.value}}" selected>{{theme.value}}</option>
        {%else%}
          <option value="{{theme.value}}">{{theme.value}}</option>
        {%endif%}
      {%endfor%}
    </select>
  </p>

  <p>
    <label for="style">Tyyli:</label> <br />
    <select name="style" id="style">
      <option value="">(valitse)</option>
      {%for style in styles%}
        {%if style.value==classes.style%}
          <option value="{{style.value}}" selected>{{style.value}}</option>
        {%else%}
          <option value="{{style.value}}">{{style.value}}</option>
        {%endif%}
      {%endfor%}
    </select>
  </p>

  <p>
    <label for="audience">Kohdeyleisö:</label> <br />
    <select name="audience" id="audience">
      <option value="">(valitse)</option>
      {%for audience in audiences%}
        {%if audience.value==classes.audience%}
          <option value="{{audience.value}}" selected>{{audience.value}}</option>
        {%else%}
          <option value="{{audience.value}}">{{audience.value}}</option>
        {%endif%}
      {%endfor%}
    </select>
  </p>
  <input type="hidden" name="csrf_token" value="{{session.csrf_token}}" />
  <input type="submit" value="Päivitä arvostelua" />
</form>
<p>
  <a href="/review/{{review.id}}">Takaisin arvosteluun</a>

</p>
{%endblock%}
